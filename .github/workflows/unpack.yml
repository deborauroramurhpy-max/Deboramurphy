name: Unpack Aurora

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/unpack.yml
      - Aurora-Alexa-Proje.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Alexa project
        run: |
          unzip -o Aurora-Alexa-Proje.zip 'lambda/*' 'skill-package/*'
          git add lambda skill-package
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract Aurora Alexa project"
          git push
